<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | EduMitra Platinum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { primary: '#6366f1', dark: '#020617' }
                }
            }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hero-gradient { background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 60%); }
    </style>
</head>
<body class="bg-dark text-slate-300 font-sans min-h-screen flex items-center justify-center p-6 hero-gradient relative overflow-hidden">
    
    <div class="absolute -top-48 -right-48 w-96 h-96 bg-primary/10 blur-[120px] rounded-full"></div>

    <div class="max-w-md w-full glass p-10 rounded-[40px] shadow-2xl relative z-10 border border-white/5">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-primary/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-primary/20">
                <i data-lucide="user-plus" class="text-primary w-8 h-8 pointer-events-none"></i>
            </div>
            <h1 class="text-3xl font-black text-white mb-2 tracking-tight">Admin Signup</h1>
            <p class="text-slate-400">Join the educator ecosystem.</p>
        </div>

        <form id="signupForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest px-1">Full Name</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 pointer-events-none"></i>
                    <input type="text" id="full_name" required class="w-full bg-white/5 border border-white/10 text-white rounded-2xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="Dr. Sarah Smith">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest px-1">Institutional Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 pointer-events-none"></i>
                    <input type="email" id="email" required class="w-full bg-white/5 border border-white/10 text-white rounded-2xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="admin@edu.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-widest px-1">Security Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 pointer-events-none"></i>
                    <input type="password" id="password" required class="w-full bg-white/5 border border-white/10 text-white rounded-2xl pl-12 pr-4 py-4 focus:ring-2 focus:ring-primary outline-none transition-all placeholder:text-slate-600" placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-primary hover:bg-indigo-400 text-white font-black py-5 rounded-2xl shadow-xl shadow-primary/20 transition-all transform hover:-translate-y-1 active:scale-95 uppercase tracking-widest text-sm">
                Register Administrator
            </button>
        </form>

        <div class="mt-8 text-center text-sm">
            <span class="text-slate-500">Already have account?</span>
            <a href="login.html" class="text-primary font-bold hover:underline ml-1">Sign In</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value;
            
            const res = await API.post('/register/teacher', { email, password, full_name, role: 'Teacher' });
            if (res.id) {
                alert('Success! Administrator account created. Redirecting to gateway.');
                window.location.href = 'login.html';
            } else {
                alert('Signup failed: ' + (res.detail || 'Service unavailable'));
            }
        };
    </script>
</body>
</html>
